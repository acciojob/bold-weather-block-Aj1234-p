<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="selected-location-block">
        <p class="location">Mumbai</p>
        <p class="current-weather">Sunny</p>
        <p class="percent-weather">78% Humidity</p>
      </div>
      <div class="weather-block">
        <div class="tomorrow">
          <p class="type">Tomorrow</p>
          <p class="item-temp">
            <span class="item-temp-number1">32<sup>o</sup></span
            >/<span>34<sup>o</sup></span>
          </p>
          <p class="type">Cloudy</p>
        </div>
        <div class="3rd Nov">
          <p class="type">3rd Nov</p>
          <p class="item-temp">
            <span class="item-temp-number1">26<sup>o</sup></span
            >/<span>20<sup>o</sup></span>
          </p>
          <p class="type">Rainy</p>
        </div>
        <div class="4th Nov">
          <p class="type">4th Nov</p>
          <p class="item-temp">
            <span class="item-temp-number1">48<sup>o</sup></span
            >/<span>36<sup>o</sup></span>
          </p>
          <p class="type">Sunny</p>
        </div>
        <div class="5th Nov">
          <p class="type">5th Nov</p>
          <p class="item-temp">
            <span class="item-temp-number1">26<sup>o</sup></span
            >/<span>18<sup>o</sup></span>
          </p>
          <p class="type">Rainy</p>
        </div>
        <div class="6th Nov">
          <p class="type">6th Nov</p>
          <p class="item-temp">
            <span class="item-temp-number1">44<sup>o</sup></span
            >/<span>32<sup>o</sup></span>
          </p>
          <p class="type">Sunny</p>
        </div>
        <div class="7th Nov">
          <p class="type">7th Nov</p>
          <p class="item-temp">
            <span class="item-temp-number1">38<sup>o</sup></span
            >/<span>26<sup>o</sup></span>
          </p>
          <p class="type">Cloudy</p>
        </div>
        <div class="8th Nov">
          <p class="type">8th Nov</p>
          <p class="item-temp">
            <span class="item-temp-number1">29<sup>o</sup></span
            >/<span>22<sup>o</sup></span>
          </p>
          <p class="type">Rainy</p>
        </div>
      </div>
    </div>
  </body>
</html>
